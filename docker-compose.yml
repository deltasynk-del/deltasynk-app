services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-deltasynk_portal}
    volumes:
      - deltasynk_portal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3030
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env.production}
      APP_URL: ${APP_URL:-https://portal.deltasynk.com}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://portal.deltasynk.com}
      MAIL_EXPOSE_DEV_LINKS: 'false'
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-Portal Owner}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@deltasynk.com}
      SEED_OWNER_PHONE: ${SEED_OWNER_PHONE:-}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-DeltaSynk Portal}
      ONFON_API_KEY: ${ONFON_API_KEY:-}
      ONFON_CLIENT_ID: ${ONFON_CLIENT_ID:-}
      ONFON_BASE_URL: ${ONFON_BASE_URL:-https://api.onfonmedia.co.ke}
      ONFON_SENDER_ID: ${ONFON_SENDER_ID:-}
      WARRANTY_CARD_URL: ${WARRANTY_CARD_URL:-https://synkmart.deltasynk.com/w/}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '3030'
    networks:
      - data
      - edge

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - edge

volumes:
  deltasynk_portal_pg_data:
  caddy_data:
  caddy_config:

networks:
  data:
    internal: true
  edge:
