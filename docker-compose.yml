services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deltasynk_portal
    ports:
      - '5435:5432'
    volumes:
      - deltasynk_portal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d deltasynk_portal']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  deltasynk_portal_pg_data:
